user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Force UTF-8 pour tous les types de contenu texte
    charset utf-8;
    charset_types text/html text/css text/plain text/xml application/javascript application/json text/markdown;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript text/markdown application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Force UTF-8 dans les en-têtes
        add_header Content-Type "text/html; charset=utf-8" always;

        # Configuration pour les fichiers statiques
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache pour les fichiers statiques
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Configuration spécifique pour les fichiers markdown
        location ~* \.md$ {
            charset utf-8;
            add_header Content-Type "text/markdown; charset=utf-8";
        }

        # Configuration spécifique pour les fichiers JSON
        location ~* \.json$ {
            charset utf-8;
            add_header Content-Type "application/json; charset=utf-8";
        }

        # Configuration spécifique pour les fichiers HTML
        location ~* \.html$ {
            charset utf-8;
            add_header Content-Type "text/html; charset=utf-8";
        }

        # Configuration spécifique pour les fichiers CSS
        location ~* \.css$ {
            charset utf-8;
            add_header Content-Type "text/css; charset=utf-8";
        }

        # Configuration spécifique pour les fichiers JS
        location ~* \.js$ {
            charset utf-8;
            add_header Content-Type "application/javascript; charset=utf-8";
        }

        # Gestion des erreurs
        error_page  404              /index.html;
        error_page  500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        # Désactiver les logs pour les fichiers de santé
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
